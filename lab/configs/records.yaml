# Typical reverse proxy. remap_required stays 1. Cache PURGE/PUSH keep wksidx gates.
records:
  diags:
    debug:
      enabled: 1
      tags: ip_allow|http|url_rewrite
    output:
      diag: S
      debug: S
      status: S
      note: S
      warning: S
      error: S
  exec_thread:
    autoconfig:
      enabled: 0
    limit: 2
  http:
    server_ports: "8080"
    cache:
      http: 1
    push_method_enabled: 0
    connect_ports: "443 8080"
  reverse_proxy:
    enabled: 1
  url_remap:
    remap_required: 1
    acl_behavior_policy: 0
    pristine_host_hdr: 0
  cache:
    ram_cache:
      size: 33554432
  log:
    logging_enabled: 3
    max_space_mb_for_logs: 20
    max_space_mb_headroom: 2
  net:
    connections_throttle: 1000
    max_connections_in: 1000
